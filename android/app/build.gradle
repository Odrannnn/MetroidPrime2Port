plugins {
    id "com.android.application"
}

// The nod stub provides only the ABI, and every entry point fails, so a build made with it
// installs, launches and stops at the disc. It answers "does this cross-build and link for
// Android" without a Rust toolchain. Default to the real nod, as ../MetroidPrimePort does,
// and let a probe opt in: the cost of forgetting -PandroidNodStub=true is the reverse of
// the cost of forgetting -PandroidNodStub=false, and only the latter ships a broken APK.
def generatedAssets = layout.buildDirectory.dir("generated/portAssets")
def useNodStub = providers.gradleProperty("androidNodStub").getOrElse("false")
// Optional local caches (tools/android_probe.sh documents where they come from). With
// -PcmakeDependencyCache, or the default build/android-deps when it exists, each dependency
// found there is used as FETCHCONTENT_SOURCE_DIR_*; every other one is downloaded by
// FetchContent, which is what a clean CI runner does.
def dependencyCache = providers.gradleProperty("cmakeDependencyCache")
    .getOrElse("${rootProject.projectDir}/../build/android-deps")
// The module-scoping step *runs* tools/scope_module.py, and CMake's FindPython3 will not look
// outside the NDK sysroot, so the host interpreter is named explicitly. MP_HOST_PYTHON3 is the
// variable tools/android_probe.sh reads.
def hostPython = providers.gradleProperty("hostPython3")
    .getOrElse(System.getenv("MP_HOST_PYTHON3") ?: "/usr/bin/python3")
def configuredNdk = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
def cmakeArguments = [
    "-DANDROID_STL=c++_static",
    // The real link, not MP_SDK_HEADERS_ONLY: the APK needs the game, the platform and
    // Aurora's libraries, which is what M0's probe script builds too.
    "-DMP_SDK_HEADERS_ONLY=OFF",
    "-DMP_ANDROID_NOD_STUB=${useNodStub}",
    "-DPython3_EXECUTABLE=${hostPython}",
    "-DAURORA_SDL3_PROVIDER=vendor",
    "-DAURORA_SDL3_LINKAGE=static",
    "-DAURORA_DAWN_PROVIDER=package",
    "-DAURORA_DAWN_LINKAGE=static",
    "-DAURORA_NOD_PROVIDER=vendor",
    "-DAURORA_NOD_LINKAGE=static",
]

["DAWN_PREBUILT": "dawn_prebuilt", "SDL": "sdl", "OPENSSL": "openssl"].each { name, directory ->
    def source = new File(dependencyCache, directory)
    if (source.isDirectory()) {
        cmakeArguments.add("-DFETCHCONTENT_SOURCE_DIR_${name}=${source}")
    }
}
if (!useNodStub.toBoolean()) {
    cmakeArguments.add("-DRust_CARGO_TARGET=aarch64-linux-android")
    // The two FetchContent packages the vendor nod build would otherwise clone from GitHub
    // (aurora_nod and Corrosion, the same names tools/android_probe.sh redirects).
    ["AURORA_NOD": "aurora_nod", "CORROSION": "corrosion"].each { name, directory ->
        def source = new File(dependencyCache, directory)
        if (source.isDirectory()) {
            cmakeArguments.add("-DFETCHCONTENT_SOURCE_DIR_${name}=${source}")
        }
    }
}
// ccache when it is installed: the native build is the long part of an APK and the same
// sources are compiled for this tree's desktop targets. AGP forwards unknown -D variables.
if (new File("/usr/bin/ccache").canExecute()) {
    cmakeArguments.add("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
    cmakeArguments.add("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
}

// Release signing. A release package needs an identity of its own: the debug key is shared,
// is not private, and says nothing about who built the package. The four values come from
// android/keystore.properties - untracked, generated by tools/make_android_keystore.sh - or
// from the environment, so a CI secret and a local file take the same path. All four are
// required; a partial set is an error rather than a silent fall back to debug, because a
// half-configured release that builds with the wrong key is worse than one that stops.
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String key, String envName ->
    def fromProperties = signingProperties.getProperty(key)
    if (fromProperties != null && !fromProperties.trim().isEmpty()) {
        return fromProperties.trim()
    }
    def fromEnvironment = System.getenv(envName)
    return (fromEnvironment != null && !fromEnvironment.trim().isEmpty()) ? fromEnvironment.trim() : null
}
def configuredKeystore = signingValue("storeFile", "MP_APK_KEYSTORE")
def configuredStorePassword = signingValue("storePassword", "MP_APK_KEYSTORE_PASSWORD")
def configuredKeyAlias = signingValue("keyAlias", "MP_APK_KEY_ALIAS")
def configuredKeyPassword = signingValue("keyPassword", "MP_APK_KEY_PASSWORD")
// A relative storeFile is resolved against android/, which is where make_android_keystore.sh
// puts it.
if (configuredKeystore != null && !configuredKeystore.startsWith("/")) {
    configuredKeystore = rootProject.file(configuredKeystore).absolutePath
}
def allowDebugSigning = providers.gradleProperty("mpDebugSigning").getOrElse("false").toBoolean()
// Null means "no key of this project's own". A signingConfigs entry can only be created inside
// the android block, so the values are carried here and the config is built there.
def signingValues = null
if (configuredKeystore != null && configuredStorePassword != null && configuredKeyAlias != null && configuredKeyPassword != null) {
    if (!file(configuredKeystore).exists()) {
        throw new GradleException(
            "keystore not found at ${configuredKeystore}\n" +
            "  storeFile in ${signingPropertiesFile} or MP_APK_KEYSTORE points at a file that is not there.")
    }
    signingValues = [
        storeFile    : configuredKeystore,
        storePassword: configuredStorePassword,
        keyAlias     : configuredKeyAlias,
        keyPassword  : configuredKeyPassword,
    ]
} else if ([configuredKeystore, configuredStorePassword, configuredKeyAlias, configuredKeyPassword].any { it != null }) {
    throw new GradleException(
        "release signing is half configured; all four of storeFile, storePassword, keyAlias and " +
        "keyPassword are needed.\n" +
        "  run tools/make_android_keystore.sh to create a key and write ${signingPropertiesFile}")
}

// Signing a release with the debug key is a decision someone has to make, not a default: a
// package signed with the shared debug key cannot be replaced later by a real identity
// without an uninstall first. So this stops instead of warning, and the way through is one
// command (-PmpDebugSigning=true, which tools/android_apk.sh passes when no key is set).
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    if (signingValues == null && !allowDebugSigning) {
        throw new GradleException(
            "refusing to sign the release with the shared debug key.\n" +
            "  pass -PmpDebugSigning=true for a build you only intend to sideload,\n" +
            "  or tools/make_android_keystore.sh to create this project its own key.")
    }
}

android {
    namespace "org.metroidprime2.port"
    compileSdk 34
    ndkVersion "29.0.14206865"
    if (configuredNdk) {
        ndkPath configuredNdk
    }

    signingConfigs {
        if (signingValues != null) {
            create("release") {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId "org.metroidprime2.port"
        minSdk 28
        targetSdk 34
        versionCode 13
        versionName "0.6.7"

        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments(*cmakeArguments)
                // libmetroid_prime2_port.so is the one the app loads. The rest are loaded by
                // path for custom Vulkan drivers (port_gpu_driver.cpp): the shim Dawn loads
                // as libvulkan.so and libadrenotools' hook libraries.
                targets "metroid_prime2_port", "mp2_vkshim", "hook_impl", "main_hook",
                        "file_redirect_hook", "gsl_alloc_hook"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.31.5"
        }
    }

    // Third-party notices, gathered from the tree and from whatever the native build
    // fetched, so an installed app carries the terms of what it links rather than nothing.
    // The notices travel as assets because assets are the only place a build reliably
    // reaches an installed package.
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generatedLicenses"))
    // The button glyphs and binding icons (tools/make_prompt_glyphs.py) the activity unpacks.
    sourceSets.main.assets.srcDir(generatedAssets)

    // So the (unstripped, large) library is stripped when the APK is packaged rather than
    // shipped as it comes out of the link.
    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }

    buildTypes {
        debug {
            debuggable true
            // AGP compiles the debug variant's native code with -O0, and this tree does not
            // link at -O0: musyx's `_seqPlaySong` (extern/musyx-port/src/musyx/runtime/
            // s_data.c) is a C99 `inline` definition with no out-of-line copy, so the call the
            // compiler cannot inline there is an undefined symbol -
            //   ld.lld: error: undefined symbol: _seqPlaySong
            //   >>> referenced by s_data.c:597 ... did you mean: seqPlaySong
            // RelWithDebInfo and Release inline it and link, which is why every desktop build
            // (and M0's probe) is RelWithDebInfo. The native build stays RelWithDebInfo here;
            // the Java side is still the ordinary debuggable debug variant, and the unoptimized
            // native build would be far too slow on a phone in any case.
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }
        release {
            minifyEnabled false
            // The debug variant builds the native code with -O0 and is far too slow to play,
            // so a release build is the one worth installing once M4 asks for one. It is
            // signed with this project's own key when one is configured, and never with the
            // shared debug key unless that was asked for explicitly.
            if (signingValues != null) {
                signingConfig signingConfigs.release
            } else if (allowDebugSigning) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

tasks.register("syncPortAssets", Sync) {
    into generatedAssets
    from("../../textures") {
        into "textures"
    }
}
tasks.named("preBuild").configure {
    dependsOn("syncPortAssets")
}

// Gathers the licence of every third-party component the native build links: the vendored
// snapshots in the tree, and whatever CMake fetched. An installed app then carries the terms
// of what it contains, which an APK otherwise would not.
//
// The same task ../MetroidPrimePort carries, minus what that tree has and this one does not:
// no astcenc (Aurora's texture encoder is not vendored here), and the notices are named after
// this tree's own vendored directories. extern/musyx is upstream's unused submodule, not
// linked, so it ships nothing; extern/musyx-port is the runtime that is.
tasks.register("syncLicenseNotices", Sync) {
    def outputDir = layout.buildDirectory.dir("generatedLicenses")
    into outputDir
    // zstd ships both LICENSE and COPYING, and several packages appear under every build
    // variant, so more than one source can land on a name. They are the same terms, so the
    // first one wins rather than failing the build.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The port's own grant and notice come first: an installed app that links MIT and zlib
    // components has to carry their terms, and a grant nobody can read inside the package is
    // not much of a grant.
    from("../../LICENSE") { rename { "port-license.txt" } }
    from("../../NOTICE") { rename { "port-notice.txt" } }
    from("../../extern/aurora/LICENSE") { rename { "aurora.txt" } }
    from("../../extern/musyx-port/LICENSE") { rename { "musyx-port.txt" } }
    from("../../extern/GamepadMotionHelpers/LICENSE") { rename { "gamepadmotionhelpers.txt" } }
    from("../../extern/adrenotools/LICENSE") { rename { "adrenotools.txt" } }
    from("../../extern/adrenotools/lib/linkernsbypass/LICENSE") { rename { "linkernsbypass.txt" } }
    // The fetched packages live beside the native build output, so they are only present once
    // a native build has run at least once. Each is named after its package: the same notice
    // appears in several build variants, and a glob rename would not flatten those paths,
    // leaving notices buried in assets/<variant>/<abi>/ where nothing would find them.
    // Every fetched package, not a fixed list: abseil, freetype, libpng and the rest are
    // linked in too.
    from(layout.projectDirectory.dir(".cxx")) {
        include "**/_deps/*-src/LICENSE*"
        include "**/_deps/*-src/COPYING*"
        // A copy cmake/AndroidOpenSSL.cmake makes, because the OpenSSL source may come from
        // the dependency cache rather than _deps.
        include "**/_deps/openssl-license/LICENSE*"
        // A FileTree carries only files, so the copy spec never sees a directory: naming one
        // in eachFile is what produced an empty path. The notice goes to the root of the asset
        // dir, because the same notice appears under every build variant and nested paths
        // would ship it several times in places nothing would look. The first licence of a
        // package is <dep>.txt, any further one <dep>-<file>.
        eachFile { details ->
            def dep = details.file.parentFile.name
            def name = details.file.name
            details.relativePath = new RelativePath(true, ".")
            details.path = (name ==~ /(?i)LICEN[CS]E(\.(txt|md))?/) ? "${dep}.txt" : "${dep}-${name}"
        }
        includeEmptyDirs = false
    }
    // Prebuilt packages that ship no licence of their own (Dawn, nod).
    from("../../packaging/licenses") { include "*.txt" }
    // freetype's FreeType License is not on the LICENSE/COPYING path above.
    from(layout.projectDirectory.dir(".cxx")) {
        include "**/_deps/freetype-src/docs/FTL.TXT"
        eachFile { details -> details.path = "freetype-FTL.txt" }
        includeEmptyDirs = false
    }
    doLast {
        def out = outputDir.get().asFile
        if (!out.exists() || out.listFiles()?.length == 0) {
            logger.warn("no third-party notices found; the APK will carry none")
        } else {
            logger.lifecycle("collected ${out.listFiles().length} third-party notice(s) for the APK")
        }
    }
}

// The notices of fetched packages exist only once the native build has fetched them, so they
// are gathered after it and before anything reads the asset directories: the asset merge, and
// lint, which scans them. Run earlier, a clean build packages none of them.
tasks.named("syncLicenseNotices").configure {
    mustRunAfter(tasks.matching { it.name.startsWith("buildCMake") || it.name.startsWith("externalNativeBuild") })
}
tasks.matching { it.name ==~ /merge\w*Assets/ || it.name.toLowerCase().contains("lint") }.configureEach {
    dependsOn("syncLicenseNotices")
}
