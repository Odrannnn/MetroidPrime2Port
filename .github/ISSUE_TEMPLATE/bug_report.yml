name: Bug report
description: A crash, a graphics or audio problem, broken controls, or anything else that doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The log file is the most useful thing you can attach: please don't skip it.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Linux (AppImage)
        - Linux (tarball or own build)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: |
        The release (e.g. 0.5.0) and, if you can, the build id: the F1 menu header (also F1 > System > About) shows "Build: …",
        and it's in the first lines of the log.
      placeholder: "0.5.0 (631bcff6)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device, GPU and OS
      description: Phone model and Android version, or CPU/GPU, OS and graphics driver.
      placeholder: "Samsung Galaxy S23, Android 14 / Ryzen 5 + RX 6600, Fedora 41, Mesa 25.1"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots or a short video help a lot for graphics bugs.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game (area/room), what you did, and whether it happens every time.
      placeholder: |
        1. Load the save at Temple Grounds, Landing Site
        2. Switch to the Dark Beam
        3. The game closes
    validations:
      required: false

  - type: dropdown
    id: when
    attributes:
      label: When does it happen?
      options:
        - It never starts (closes or errors right away)
        - Before reaching gameplay (disc picker, menus, intro)
        - During gameplay
    validations:
      required: true

  - type: checkboxes
    id: setup
    attributes:
      label: Setup
      description: Tick everything that applies.
      options:
        - label: My disc is Metroid Prime 2 USA v1.00 (G2ME01)
        - label: My disc is PAL (G2MP01) or Metroid Prime Trilogy (R3ME01, R3MP01)
        - label: Using a controller (not keyboard/mouse or touch)
        - label: It worked in an earlier version

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        Drag `metroid_prime2_port.log` into this box (after a crash, the next start renames it to
        `metroid_prime2_port.old.log`, so send that one if you restarted the game). Paths and user names are already removed from it.
        - **Linux tarball, AppImage:** `~/.local/share/Metroid Prime 2: Echoes/` (or `$XDG_DATA_HOME/Metroid Prime 2: Echoes/`)
        - **Android:** the app's data folder (`Android/data/org.metroidprime2.port/files/` over USB); if you moved the data folder, it's in that folder

        On desktop it's always in the same folder as `settings.cfg`.

        If there's no log, check that F1 > System > Log > "Write the log to a file" is ticked (it is by default).
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Settings you changed (resolution, frame rate, renderer…), environment variables, other things you tried.
    validations:
      required: false
