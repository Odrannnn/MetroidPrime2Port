name: macos

# Experimental Apple Silicon build. Start it by hand like windows.yml; it also
# runs weekly, as windows.yml does. Not yet run on Actions.
on:
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependencies
        run: brew install ninja openssl@3 llvm

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos-arm64
          # Objects this build did not use are dropped before saving.
          evict-old-files: job

      # Configure downloads and unpacks about a dozen dependencies. Keep the
      # unpacked sources and the stamps that say they are current; the build
      # directories beside them are left out, since ccache covers those.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build-mac/_deps/*-src
            build-mac/_deps/*-subbuild
          key: deps-macos-${{ hashFiles('CMakeLists.txt', 'extern/aurora/**/CMakeLists.txt', 'extern/aurora/**/*.cmake') }}

      # SDL3, nod, OpenSSL and the bundled libraries are linked in statically,
      # so the app needs nothing from Homebrew on a player's Mac. The runner's
      # Homebrew xxhash/zstd would otherwise be found and linked dynamically.
      # The REL module scoping step (tools/scope_module.py --format macho) needs
      # llvm-objcopy and llvm-nm, which Apple's toolchain lacks; CMake finds them
      # through LLVM_BIN (Homebrew's llvm).
      - name: Configure
        run: >
          LLVM_BIN="$(brew --prefix llvm)/bin" cmake -S . -B build-mac -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DMP_SDK_HEADERS_ONLY=OFF
          -DAURORA_ENABLE_TESTS=ON
          -DBUILD_SHARED_LIBS=OFF
          -DAURORA_SDL3_PROVIDER=vendor
          -DAURORA_SDL3_LINKAGE=static
          -DAURORA_NOD_LINKAGE=static
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
          -DOPENSSL_USE_STATIC_LIBS=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_xxHash=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_zstd=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

      # Build, the port's tests and the GX FIFO regressions.
      - uses: ./.github/actions/build-and-test
        with:
          build-dir: build-mac
          jobs: "-j"
          # -k 0: report every failing file in one run while the port is brought up.
          build-args: "-- -k 0"

      # An unsigned arm64 binary does not run at all, so the bundle is signed
      # ad hoc. Players still have to clear the quarantine flag (or right-click
      # > Open) until it is signed with a Developer ID and notarised.
      - name: Package
        run: |
          app="dist/Metroid Prime 2 Port.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build-mac/metroid_prime2_port "$app/Contents/MacOS/"
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          iconset=$(mktemp -d)/icon.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z $size $size packaging/metroid_prime2_port.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
          done
          cp packaging/metroid_prime2_port.png "$iconset/icon_128x128@2x.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/metroid_prime2_port.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>metroid_prime2_port</string>
            <key>CFBundleIdentifier</key><string>io.github.odrannnn.metroidprime2port</string>
            <key>CFBundleName</key><string>Metroid Prime 2 Port</string>
            <key>CFBundleDisplayName</key><string>Metroid Prime 2 Port</string>
            <key>CFBundleIconFile</key><string>metroid_prime2_port</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>GCSupportsControllerUserInteraction</key><true/>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^          //' "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          # The same notices as the Linux packages, plus the statically
          # linked OpenSSL's, which this package alone carries.
          bash tools/collect_licenses.sh build-mac dist/licenses
          cp "$(brew --prefix openssl@3)/LICENSE.txt" dist/licenses/openssl.txt 2>/dev/null ||
            curl -fsSL -o dist/licenses/openssl.txt https://raw.githubusercontent.com/openssl/openssl/openssl-3.5/LICENSE.txt
          cp README.md dist/README.md
          python3 tools/write_recomplauncher.py --platform macos dist/recomplauncher.json
          cp docs/SETTINGS.md dist/SETTINGS.md
          cp docs/MODS.md dist/MODS.md
          cp docs/CONSOLE.md dist/CONSOLE.md

      # Fail if a library that should be static is linked dynamically again:
      # only the system's own libraries and frameworks may be referenced.
      - name: Check the executable's libraries
        run: |
          for exe in metroid_prime2_port; do
            otool -L "dist/Metroid Prime 2 Port.app/Contents/MacOS/$exe" | tee libs.txt
            if tail -n +2 libs.txt | grep -vE '^\s*(/usr/lib/|/System/Library/)'; then
              echo "$exe links libraries outside the system" >&2; exit 1
            fi
          done
          codesign --verify --deep --strict "dist/Metroid Prime 2 Port.app"

      - name: Check packaged startup
        run: |
          set +e
          MP2_NO_DISC_DIALOG=1 "dist/Metroid Prime 2 Port.app/Contents/MacOS/metroid_prime2_port" 2> startup-error.log
          code=$?
          set -e
          cat startup-error.log
          [ "$code" = 1 ] || { echo "Unexpected exit code: $code" >&2; exit 1; }
          grep -q 'no disc image given' startup-error.log || { echo 'Packaged executable did not reach main' >&2; exit 1; }
          # The data folder must be outside the bundle, or the signature breaks.
          [ ! -e "dist/Metroid Prime 2 Port.app/Contents/Resources/user" ] || { echo 'Startup wrote into the app bundle' >&2; exit 1; }
          codesign --verify --deep --strict "dist/Metroid Prime 2 Port.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metroid_prime2_port-macos
          path: dist
